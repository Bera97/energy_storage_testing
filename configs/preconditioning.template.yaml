# Charge termination is configured only under charge.termination.
# hold_time_s is interpreted according to termination.mode.
# maximum_duration_s and maximum_cv_duration_s are failure timeouts.
# Review specimen, wiring, ratings, and settings before hardware use.
schema_version: 1
experiment:
  type: preconditioning
  name: cell_preconditioning
  cycles: 2
dut:
  name: null
  specimen_id: null
  category: battery
  chemistry: null
  manufacturer: null
  model: null
  nominal_capacity_ah: null
  nominal_capacitance_f: null
  ratings:
    minimum_voltage_v: null
    maximum_voltage_v: null
    maximum_continuous_charge_current_a: null
    maximum_continuous_discharge_current_a: null
instrument:
  visa_address: USB0::0x2A8D::0x9201::MY61391173::0::INSTR
  channel: 1
  four_wire: false
  nplc: 1.0
acquisition:
  interval_s: 0.2
  maximum_sample_gap_s: null
charge:
  mode: cc_cv
  current:
    current_a: null
    current_fraction: null
    c_rate: 0.5
  target_voltage_v: null
  cv_voltage_tolerance_v: null
  termination:
    mode: current_threshold
    current_reference: rated_max_charge_current
    current_factor: null
    hold_time_s: null
  maximum_duration_s: null
  maximum_cv_duration_s: null
rest:
  after_charge_s: 900
  after_discharge_s: 900
discharge:
  mode: constant_current
  current:
    basis: rated_max_discharge_fraction
    factor: 0.5
  cutoff_voltage_v: null
  maximum_duration_s: null
output:
  root_directory: runs
  file_name: REPLACE_WITH_A_NAME
  analysis_directory: analysis_outputs
