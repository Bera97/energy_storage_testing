schema_version: 1
experiment:
  # Options: preconditioning | charge_current_sweep | cv_hold_sweep.
  type: preconditioning
  name: cell_preconditioning
  cycles: 2
dut:
  name: null
  specimen_id: null
  # Options: battery | edlc | lic.
  category: battery
  chemistry: null
  manufacturer: null
  model: null
  nominal_capacity_ah: null
  nominal_capacitance_f: null
  ratings:
    minimum_voltage_v: null
    maximum_voltage_v: null
    maximum_continuous_charge_current_a: null
    maximum_continuous_discharge_current_a: null
instrument:
  visa_address: USB0::0x2A8D::0x9201::MY61391173::0::INSTR
  # Options: 1 | 2.
  channel: 1
  # Options: true (4-wire) | false (2-wire).
  four_wire: false
  nplc: 1.0
acquisition:
  interval_s: 0.2
  maximum_sample_gap_s: null
charge:
  mode: cc_cv
  # Choose one: current_a | current_fraction | c_rate; others null.
  current:
    current_a: null
    current_fraction: null
    c_rate: 0.5
  target_voltage_v: null
  cv_voltage_tolerance_v: null
  termination:
    # Options: current_threshold | from_cv_entry | after_current_threshold.
    mode: current_threshold
    # Options: rated_max_charge_current | configured_charge_current.
    current_reference: rated_max_charge_current
    current_factor: null
    # One number for fixed holding; a list for cv_hold_sweep.
    hold_time_s: null
  maximum_duration_s: null
  maximum_cv_duration_s: null
rest:
  after_charge_s: 900
  after_discharge_s: 900
discharge:
  mode: constant_current
  current:
    basis: rated_max_discharge_fraction
    factor: 0.5
  cutoff_voltage_v: null
  maximum_duration_s: null
output:
  root_directory: runs
  file_name: REPLACE_WITH_A_NAME
  analysis_directory: analysis_outputs
