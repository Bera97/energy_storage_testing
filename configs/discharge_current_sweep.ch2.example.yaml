# Illustrative, not hardware-qualified. Review inherited ratings and settings.
# discharge.current sets INITIAL preparation; sweep.discharge_current_a sets conditions.
schema_version: 1
experiment:
  type: discharge_current_sweep
  name: discharge_current_comparison
  cycles: 1
dut:
  name: 'Tecate LIC parallel assembly: 2 x 40 F'
  specimen_id: REPLACE_PREVIEW_DISCHARGE_CH2
  category: lic
  chemistry: LIC
  manufacturer: Tecate Group
  model: 2 x TPLCE-3R8/40MR8X20 in parallel
  nominal_capacity_ah: 0.03556
  nominal_capacitance_f: 80.0
  ratings:
    minimum_voltage_v: 2.19
    maximum_voltage_v: 3.81
    maximum_continuous_charge_current_a: 0.4
    maximum_continuous_discharge_current_a: 0.4
instrument:
  visa_address: USB0::0x2A8D::0x9201::REPLACE_SERIAL::0::INSTR
  channel: 2
  four_wire: true
  nplc: 1.0
acquisition:
  interval_s: 0.2
  maximum_sample_gap_s: 0.5
charge:
  mode: cc_cv
  current:
    current_a: 0.2
    current_fraction: null
    c_rate: null
  target_voltage_v: 3.8
  cv_voltage_tolerance_v: 0.05
  termination:
    mode: after_current_threshold
    current_reference: configured_charge_current
    current_factor: 0.5
    hold_time_s: 5
  maximum_duration_s: 3600
  maximum_cv_duration_s: 1800
rest:
  after_charge_s: 5
  after_discharge_s: 15
  mode: zero_current_logging
  maximum_abs_current_a: 0.001
discharge:
  mode: constant_current
  current:
    basis: rated_max_discharge_fraction
    factor: 1
  cutoff_voltage_v: 2.2
  maximum_duration_s: 3600
output:
  root_directory: runs
  analysis_directory: analysis_outputs
  file_name: discharge_current_sweep
sweep:
  discharge_current_a:
  - 0.1
  - 0.2
  repeats: 1
  initial_discharge: true
