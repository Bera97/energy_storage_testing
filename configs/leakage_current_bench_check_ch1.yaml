schema_version: 1
experiment:
  type: leakage_current_test
  name: leakage_current_bench_check_7_8_ch1
  cycles: 1
dut:
  name: "Tecate LIC parallel assembly: 2 x 40 F"
  specimen_id: "7&8"
  category: lic
  chemistry: LIC
  manufacturer: Tecate Group
  model: 2 x TPLCE-3R8/40MR8X20 in parallel
  nominal_capacity_ah: 0.03556
  nominal_capacitance_f: 80.0
  ratings:
    minimum_voltage_v: 2.19
    maximum_voltage_v: 3.81
    maximum_continuous_charge_current_a: 0.4
    maximum_continuous_discharge_current_a: 0.4
instrument:
  visa_address: USB0::0x2A8D::0x9201::MY61391173::0::INSTR
  channel: 1
  four_wire: true
  nplc: 1.0
acquisition:
  interval_s: 0.2
  maximum_sample_gap_s: 0.5
# Hold voltage = charge.target_voltage_v; compliance current = charge.current.
# The rest and discharge sections are required by the shared schema and are
# ignored by the leakage test.
charge:
  mode: cc_cv
  current:
    current_a: 0.4
    current_fraction: null
    c_rate: null
  target_voltage_v: 3.8
  cv_voltage_tolerance_v: 0.05
  termination:
    mode: after_current_threshold
    current_reference: configured_charge_current
    current_factor: 0.25
    hold_time_s: 5
  maximum_duration_s: 3600
  maximum_cv_duration_s: 1800
rest:
  after_charge_s: 5
  after_discharge_s: 15
  mode: zero_current_logging
  maximum_abs_current_a: 0.001
discharge:
  mode: constant_current
  current:
    basis: rated_max_discharge_fraction
    factor: 1
  cutoff_voltage_v: 3.4
  maximum_duration_s: 3600
output:
  root_directory: runs
  analysis_directory: analysis_outputs
  file_name: leakage_current_bench_check_7_8_ch1
execution:
  expected_serial: MY61391173
  maximum_voltage_v: 3.81
  maximum_current_a: 0.4
leakage:
  maximum_duration_s: 600
  schedule:
    - {until_s: 60, interval_s: 0.5}
    - {until_s: 600, interval_s: 1}
  early_stop:
    enabled: false
  report_times_s: [60, 300, 600]
  final_window_s: 120
  maximum_consecutive_read_failures: 2
