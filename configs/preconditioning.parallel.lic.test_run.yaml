schema_version: 1

experiment:
  type: preconditioning
  name: cell_preconditioning

  # Total complete charge/rest/discharge/rest sequences.
  cycles: 1

dut:
  name: Tecate 40F LIC
  specimen_id: "9&10"

  # battery, edlc, or lic
  category: lic
  chemistry: LIC
  manufacturer: Tecate Group
  model: TPLCE-3R8/40MR8X20

  # Required for battery charging based on C-rate.
  nominal_capacity_ah: 0.03556

  # Optional descriptive field for capacitor DUTs.
  nominal_capacitance_f: 80.0

  ratings:
    minimum_voltage_v: 2.19
    maximum_voltage_v: 3.81
    maximum_continuous_charge_current_a: 0.4
    maximum_continuous_discharge_current_a: 0.4

instrument:
  visa_address: "USB0::0x2A8D::0x9201::MY61391173::0::INSTR"
  channel: 1
  four_wire: true
  nplc: 1.0

acquisition:
  interval_s: 0.2

  # Maximum permitted gap between consecutive recorded samples.
  # Must be >= interval_s and < charge termination hold_time_s.
  maximum_sample_gap_s: 0.5

charge:
  mode: cc_cv

  current:
    # Set exactly ONE value; leave the others null.
    # current_a: amperes; current_fraction: fraction of rating.
    # c_rate: all device categories; requires nominal_capacity_ah.
    current_a: null
    current_fraction: 1
    c_rate: null

  target_voltage_v: 3.8

  # Absolute voltage difference allowed for CV qualification.
  # Must be positive and smaller than target_voltage_v.
  cv_voltage_tolerance_v: 0.05

  termination:
    # Alternative: configured_charge_current or rated_max_charge_current
    current_reference: configured_charge_current
    current_factor: 0.05
    hold_time_s: 5

  maximum_duration_s: 3600
  maximum_cv_duration_s: 1800

rest:
  after_charge_s: 5
  after_discharge_s: 30

discharge:
  mode: constant_current

  current:
    basis: rated_max_discharge_fraction
    factor: 1

  cutoff_voltage_v: 2.2
  maximum_duration_s: 3600

output:
  # The dry run does not create this directory.
  root_directory: runs
  # Run folder becomes <timestamp>_<file_name> inside root_directory.
  file_name: parralel_lic_test_run
  analysis_directory: analysis_outputs