schema_version: 1

experiment:
  type: preconditioning
  name: cell_preconditioning

  # Total complete charge/rest/discharge/rest sequences.
  cycles: 1

dut:
  name: Hanna's EDLC
  specimen_id: "1"

  # battery, edlc, or lic
  category: edlc
  chemistry: EDLC
  manufacturer: Eaton
  model: something
  datasheet_reference: noref

  # Required for battery charging based on C-rate.
  nominal_capacity_ah: 0.000336

  # Optional descriptive field for capacitor DUTs.
  nominal_capacitance_f: 0.22

  ratings:
    minimum_voltage_v: 0.0
    maximum_voltage_v: 5.55
    maximum_continuous_charge_current_a: 0.01
    maximum_continuous_discharge_current_a: 0.01

instrument:
  visa_address: "USB0::0x2A8D::0x9201::MY61391173::0::INSTR"
  channel: 1
  four_wire: false
  nplc: 1.0

acquisition:
  interval_s: 0.2

  # Maximum permitted gap between consecutive recorded samples.
  # Must be >= interval_s and < charge termination hold_time_s.
  maximum_sample_gap_s: 0.5

charge:
  mode: cc_cv

  current:
    # Battery: capacity_c_rate with factor 0.5
    # EDLC: rated_max_charge_fraction with factor 0.10
    # LIC: rated_max_charge_fraction with factor 0.50
    basis: rated_max_charge_fraction
    factor: 0.5

  target_voltage_v: 5.5

  # Absolute voltage difference allowed for CV qualification.
  # Must be positive and smaller than target_voltage_v.
  cv_voltage_tolerance_v: 0.05

  termination:
    # Alternative: configured_charge_current
    current_reference: rated_max_charge_current
    current_factor: 0.05
    hold_time_s: 10

  maximum_duration_s: 3600
  maximum_cv_duration_s: 1800

rest:
  after_charge_s: 30
  after_discharge_s: 30

discharge:
  mode: constant_current

  current:
    basis: rated_max_discharge_fraction
    factor: 0.25

  cutoff_voltage_v: 0.05
  maximum_duration_s: 3600

output:
  # The dry run does not create this directory.
  root_directory: runs