# Charge termination is configured only under charge.termination.
# hold_time_s is interpreted according to termination.mode.
# maximum_duration_s and maximum_cv_duration_s are failure timeouts.
# Review specimen, wiring, ratings, and settings before hardware use.
schema_version: 1
experiment:
  type: preconditioning
  name: cell_preconditioning
  cycles: 2
dut:
  name: Tecate 40F LIC
  specimen_id: '10'
  category: lic
  chemistry: LIC
  manufacturer: Tecate Group
  model: TPLCE-3R8/40MR8X20
  nominal_capacity_ah: 0.01778
  nominal_capacitance_f: 40.0
  ratings:
    minimum_voltage_v: 2.19
    maximum_voltage_v: 3.81
    maximum_continuous_charge_current_a: 0.2
    maximum_continuous_discharge_current_a: 0.2
instrument:
  visa_address: USB0::0x2A8D::0x9201::MY61391173::0::INSTR
  channel: 1
  four_wire: false
  nplc: 1.0
acquisition:
  interval_s: 0.2
  maximum_sample_gap_s: 0.5
charge:
  mode: cc_cv
  current:
    current_a: null
    current_fraction: 0.5
    c_rate: null
  target_voltage_v: 3.8
  cv_voltage_tolerance_v: 0.05
  termination:
    mode: current_threshold
    current_reference: configured_charge_current
    current_factor: 0.05
    hold_time_s: 5
  maximum_duration_s: 3600
  maximum_cv_duration_s: 1800
rest:
  after_charge_s: 15
  after_discharge_s: 60
discharge:
  mode: constant_current
  current:
    basis: rated_max_discharge_fraction
    factor: 0.5
  cutoff_voltage_v: 2.2
  maximum_duration_s: 3600
output:
  root_directory: runs
  file_name: lic_test_run
  analysis_directory: analysis_outputs
